name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e3a4f9c928a44664acb918bd508bc5b61f # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@8207623a1d7a9ed5dfd28c3e9d37ac2f359c5e2d # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@11.12.1
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Verify source
        run: npm run verify
      - name: Inspect package surface
        run: npm pack --dry-run
      - name: Require a reproducible checkout
        run: git diff --exit-code

